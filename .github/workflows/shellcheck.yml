name: ShellCheck

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test maintenance and web UI
        run: node --test scripts/*.test.mjs
      - name: Run ShellCheck
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}"
          ./check.sh
