# ============================================================================
#  Glovebox: optional settings file
# ============================================================================
#
# You don't need to edit this. Plug the Pi in, and after a couple of minutes
# it offers its own Wi-Fi network, Glovebox-XXXX. Join it with your phone: a
# setup wizard opens for your Wi-Fi, backups (with a connection test), extra
# drives and your car.
#
# This file is for setting up without a phone, or preparing several cards
# the same way. To use a setting, delete the "# " in front of it and fill in
# your value; anything you leave alone keeps its default. Every setting is
# listed in deploy/glovebox.toml in the Glovebox repository.
#
# When Glovebox starts, it applies this file (passwords go to root-only
# files), removes it, and leaves glovebox-status.txt here saying what it did
# or what was wrong. To change settings this way later, put a new
# glovebox.toml here and restart the Pi.
#
# Moved house or changed your Wi-Fi? Put an empty file named glovebox-setup
# here instead and restart the Pi: the setup network comes back.


# ---- Wi-Fi -------------------------------------------------------------------
# Your home network. The Pi Zero 2 W only does 2.4 GHz Wi-Fi.

[system]
# wifi_ssid = "your network name"
# wifi_password = "your Wi-Fi password"
# wifi_country = "US"                    # two-letter country code

# Log in over SSH with a key (the Glovebox image has no password login).
# Paste your public key, e.g. the contents of ~/.ssh/id_ed25519.pub
# ssh_key = "ssh-ed25519 AAAA... you@pc"
# hostname = "glovebox"


# ---- Backups -----------------------------------------------------------------
# This is for an SMB share: Unraid, Synology, TrueNAS, Windows, ... For NFS,
# rsync over SSH or rclone (cloud storage), see deploy/glovebox.toml; an
# rclone.conf put next to this file is used for rclone.

[archive]
# enabled = true
# recent = false                         # true: also back up all driving
#                                        # footage (15-20 GB per hour on HW4)
# recent_at_home = false                 # true: also Recent clips recorded
#                                        # at home (a car parked outside)

[archive.smb]
# server = "192.168.1.10"                # the NAS's address
# share = "TeslaCam"                     # the shared folder's name
# username = "carcam"
# password = "the share password"


# ---- Car and drives ----------------------------------------------------------

[keep_awake]
# Keeps the car awake while it backs up. Pairing happens on the Car page of
# the web app; setting the VIN here just saves typing it there.
# vin = "your 17-character VIN"

[drive]
# Size of the car's dashcam drive. By default it gets all the space except
# 4 GB that Glovebox keeps for snapshots.
# cam_size = "40G"

# Extra drives with music, a light show or Boombox sounds, copied from a
# folder on your NAS.
# [drive.music]
# size = "8G"
# source = "Music"                       # for SMB: a share, or share/folder
