<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">How Glovebox works</title><desc id="desc">The Tesla records to Glovebox's USB dashcam drive. Glovebox takes read-only snapshots, then backs up new clips over Wi-Fi at home to your NAS, server or configured cloud storage. A local browser reads snapshots and shows backup status. Optional Bluetooth keeps the car awake for its first backup after arriving home, for at most one hour.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#b6cef5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f2f5fa}.label{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#b6cef5}.heading{font-size:27px;font-weight:700;letter-spacing:-.7px}.body{font-size:18px;fill:#b2c0d5}.small{font-size:15px;fill:#b2c0d5}.line{fill:none;stroke:#b6cef5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:#b6cef5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:#192332;stroke:#394b64;stroke-width:1.3}</style><rect width="1000" height="590" rx="20" fill="#101319"/><text x="24" y="40" class="heading">A better end to every drive.</text><text x="24" y="69" class="body">Your car records. Glovebox brings the footage home.</text><rect class="node" x="24" y="96" width="238" height="298" rx="16"/><rect class="node" x="318" y="96" width="364" height="298" rx="16"/><rect class="node" x="738" y="96" width="238" height="298" rx="16"/><text x="48" y="130" class="label">01 / RECORD</text><text x="342" y="130" class="label">02 / SNAPSHOT</text><text x="762" y="130" class="label">03 / BACK UP</text><g class="icon" transform="translate(66 167)"><path d="M9 38 22 12Q25 6 32 6h65q7 0 10 6l13 26M15 38h99q12 0 12 12v21H3V50q0-12 12-12Z"/><path d="M22 38h85M15 54h19m61 0h18M42 62h45M9 71v11h15V71m81 0v11h15V71"/></g><text x="48" y="291" class="heading">Your Tesla</text><text x="48" y="322" class="body">Records as usual.</text><text x="48" y="350" class="body">One USB data cable.</text><text x="342" y="170" class="heading">Glovebox</text><text x="342" y="197" class="body">Pi or compatible USB gadget board</text><rect x="338" y="218" width="324" height="55" rx="9" fill="#152031" stroke="#394b64"/><text x="500" y="252" text-anchor="middle" style="font-size:21px;font-weight:600">USB dashcam drive</text><path class="line" d="M500 275v21" marker-end="url(#arrow)"/><rect x="338" y="300" width="324" height="70" rx="9" fill="#243952"/><text x="500" y="329" text-anchor="middle" style="font-size:21px;font-weight:600">Read-only snapshots</text><text x="500" y="354" text-anchor="middle" class="small">Safe copies for browsing and backup</text><path class="line" d="M264 246h69" marker-end="url(#arrow)"/><text x="299" y="231" text-anchor="middle" class="small">USB</text><path class="line" d="M664 334h69" marker-end="url(#arrow)"/><text x="700" y="318" text-anchor="middle" class="small">Wi-Fi</text><g class="icon" transform="translate(800 160)"><rect x="0" y="0" width="110" height="65" rx="9"/><path d="M35 0v65m40-65v65M8 48h18m17 0h24m16 0h18"/><circle cx="94" cy="16" r="2" fill="#b6cef5" stroke="none"/><path d="M20 76h70m-62-10v10m54-10v10"/></g><text x="762" y="270" class="heading">Your storage</text><text x="762" y="297" class="body">NAS, server or cloud.</text><text x="762" y="360" class="small">Verified. Resumes next time.</text><path class="line" d="M500 372v60" marker-end="url(#arrow)"/><text x="514" y="421" class="small">Local network</text><rect class="node" x="318" y="438" width="364" height="100" rx="12"/><g class="icon" transform="translate(340 461)"><rect width="46" height="35" rx="4"/><path d="M0 10h46M12 45h22m-11-10v10"/><circle cx="6" cy="5" r="1" fill="#b6cef5" stroke="none"/></g><text x="402" y="475" style="font-size:21px;font-weight:600">Your browser</text><text x="402" y="503" class="small">Clips and backup status</text><rect class="node" x="24" y="438" width="238" height="100" rx="12"/><text x="42" y="466" style="font-size:18px;font-weight:600">Optional keep-awake</text><text x="42" y="491" class="small">Glovebox → car via Bluetooth</text><text x="42" y="515" class="small">First home backup · ≤ 1 hour</text><rect class="node" x="738" y="438" width="238" height="100" rx="12"/><text x="756" y="475" style="font-size:18px;font-weight:600">At home, automatically.</text><text x="756" y="503" class="small">SMB · NFS · rsync · rclone</text><text x="24" y="570" class="label">YOUR DRIVE. YOUR FOOTAGE. YOUR RULES.</text></svg>